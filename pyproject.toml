[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "symphonix-eps-ig"
version = "0.1.0"
description = "Symphonix Electronic Prescription Service FHIR R4 Implementation Guide validator harness"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "CC0-1.0" }
authors = [{ name = "Symphonix Health" }]
dependencies = [
    "fhir.resources>=7.1.0",
    "fhirpathpy>=2.0.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
