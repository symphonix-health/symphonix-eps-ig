<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 56" role="img" aria-label="Generated by caid-agent">
  <title>Generated by caid-agent</title>
  <desc>Provenance stamp for applications, documentation, and compliance artefacts produced by the caid-agent pipeline.</desc>

  <!-- Pill background -->
  <rect x="1" y="1" width="338" height="54" rx="27" fill="#fbfdfd" stroke="#0d4f4f" stroke-width="1.5"/>

  <!-- Mark (downscaled to 32x32) at left -->
  <g transform="translate(12, 12) scale(0.5)">
    <circle cx="32" cy="32" r="24" fill="none" stroke="#0d4f4f" stroke-width="2" stroke-dasharray="2 3" opacity="0.32"/>
    <g stroke="#0d4f4f" stroke-width="3" stroke-linecap="round" fill="none">
      <line x1="32" y1="32" x2="32" y2="10"/>
      <line x1="32" y1="32" x2="52" y2="44"/>
      <line x1="32" y1="32" x2="12" y2="44"/>
    </g>
    <rect x="24" y="24" width="16" height="16" rx="3" fill="#0d4f4f"/>
    <rect x="26" y="4"  width="12" height="12" rx="2.5" fill="#f59e0b"/>
    <rect x="46" y="38" width="12" height="12" rx="2.5" fill="#f59e0b"/>
    <rect x="6"  y="38" width="12" height="12" rx="2.5" fill="#f59e0b"/>
  </g>

  <!-- Two-line label -->
  <text x="56" y="24"
        font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, 'Roboto Mono', monospace"
        font-size="11" font-weight="400" fill="#5b6b6b" letter-spacing="1.2">GENERATED BY</text>
  <text x="56" y="44"
        font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, 'Roboto Mono', monospace"
        font-size="18" font-weight="700" fill="#0d4f4f" letter-spacing="-0.3">caid-agent</text>

  <!-- Tamper-evident seal dot -->
  <circle cx="320" cy="28" r="6" fill="#f59e0b"/>
  <text x="320" y="31.5" font-family="ui-monospace, monospace" font-size="8" font-weight="700" fill="#0d4f4f" text-anchor="middle">✓</text>
</svg>
